name: Compiler bootstrap

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bootstrap:
    name: Self-hosting fixpoint (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build the reference interpreter in release mode
        run: cargo build --locked --release --manifest-path rppc/Cargo.toml
      - name: Build two native compiler generations and compare their C output
        shell: pwsh
        run: |
          if ($IsWindows) {
            & ./.github/scripts/enter-msvc.ps1
          }
          python .github/scripts/check.py bootstrap
